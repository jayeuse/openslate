[project]
name = "openslate-backend"
version = "0.1.0"
description = "OpenSlate FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.3.0",
    "python-dotenv>=1.2.3",
    "pyjwt[crypto]>=2.14.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "uuid6>=2025.0.1",
    "babel>=2.18.0,<3",
    "pillow>=12.3.0,<13",
    "pypdf>=6.18.1,<7",
    "defusedxml>=0.7.1,<1",
    "cryptography>=46.0.5",
    # 3.2.9 removes upstream typing required by our strict mypy checks.
    "xlsxwriter>=3.2.8,<3.2.9",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-split>=0.10",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
    "types-defusedxml>=0.7.0.20260504",
]
manager = [
    "pyinstaller>=6,<7",
    "pywebview>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a PostgreSQL test database"]

[tool.mutmut]
# Mutation testing is the safety net for test consolidation (tdd-workflow
# references/consolidation.md). It is never part of the push gate. Scope each
# run to the modules under review with `only_mutate`, never the whole app.
source_paths = ["app/"]
also_copy = ["operations/", "migrations/", "alembic.ini"]
# Mutation runs cover app/ modules whose owner tests need no stack. Repository tooling
# tests (tests/operations) and the email-template route read files outside the copy in
# backend/mutants, so they stay out of mutation runs.
pytest_add_cli_args = [
    "--no-cov",
    "-q",
    "-m",
    "not integration",
    "--ignore=tests/operations",
    "--ignore=tests/auth/test_email_templates.py",
]
# Fork children would inherit pooled database connections.
process_isolation = "forkserver"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT"]
# PT006/PT007/PT018 are layout preferences. PT011/PT012 are real test-quality
# findings deferred to item 10 of the Tier 2.5 plan (docs/plans/test-suite-tier-2-5.md);
# remove them from this list once their existing sites are fixed.
ignore = ["PT006", "PT007", "PT011", "PT012", "PT018"]

[tool.ruff.lint.per-file-ignores]
# Repository tooling tests use unittest on purpose (stdlib-only runner).
"../tests/tooling/**" = ["PT009", "PT027"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
