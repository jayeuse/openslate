[project]
name = "openslate-backend"
version = "0.1.0"
description = "OpenSlate FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyjwt[crypto]>=2.14.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "uuid6>=2025.0.1",
    "babel>=2.18.0,<3",
    "pillow>=12.3.0,<13",
    "pypdf>=6.18.1,<7",
    "defusedxml>=0.7.1,<1",
    "clamdpy==0.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
