resources:
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    name: supabase
    per_connection_buffer_limit_bytes: 32768  # 32 KiB

    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000

    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': >-
                type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              normalize_path: true
              merge_slashes: true
              path_with_escaped_slashes_action: REJECT_REQUEST
              use_remote_address: true
              common_http_protocol_options:
                headers_with_underscores_action: REJECT_REQUEST
              upgrade_configs:
                - upgrade_type: websocket
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "[%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] %REQ(:METHOD)% %RESPONSE_CODE% %BYTES_SENT%\n"

              route_config:
                name: supabase_route
                virtual_hosts:
                  - name: supabase_host
                    domains:
                      - '*'
                    cors:
                      allow_origin_string_match:
                        - exact: '${SUPABASE_PUBLIC_URL}'
                      allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD"
                      allow_headers: "*"
                      expose_headers: "*"
                      max_age: "3600"
                    request_headers_to_add:
                      - header:
                          key: X-Forwarded-Host
                          value: "%REQ(:AUTHORITY)%"
                        append_action: ADD_IF_ABSENT
                      - header:
                          key: X-Forwarded-Port
                          value: "%DOWNSTREAM_LOCAL_PORT%"
                        append_action: ADD_IF_ABSENT
                    routes:
                      # API keys are accepted in headers only. Reject URL credentials
                      # before any Auth, Storage, or Studio route can handle them.
                      - match:
                          prefix: /
                          query_parameters:
                            - name: apikey
                              present_match: true
                        direct_response:
                          status: 400
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /auth/v1/verify
                        route:
                          cluster: auth
                          prefix_rewrite: /verify
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /auth/v1/verify
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /auth/v1/.well-known/jwks.json
                        route:
                          cluster: auth
                          prefix_rewrite: /.well-known/jwks.json
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /auth/v1/.well-known/jwks.json
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /storage/v1/
                        route:
                          cluster: storage
                          prefix_rewrite: /
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /storage/v1
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - name: auth-v1-protected
                        match:
                          prefix: /auth/v1/
                        route:
                          cluster: auth
                          prefix_rewrite: /
                          timeout: 30s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /auth/v1/
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': >-
                              type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true

                      # Keep metadata paths from falling through to Studio.
                      - match:
                          path: /pg
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /pg/
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /rest/
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /graphql/
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /realtime/
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /functions/
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /api/mcp
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /mcp
                        direct_response:
                          status: 404
                        typed_per_filter_config:
                          envoy.filters.http.basic_auth:
                            '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                            disabled: true
                          envoy.filters.http.rbac:
                            '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /
                        route:
                          cluster: studio
                          timeout: 30s
                        request_headers_to_remove:
                          - authorization
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config:
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

              http_filters:
                - name: envoy.filters.http.cors
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                - name: envoy.filters.http.basic_auth
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
                    users:
                      inline_string: '${DASHBOARD_BASIC_AUTH}'

                # Returns 401 for missing/invalid API keys on protected API routes.
                - name: envoy.filters.http.lua
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    inline_code: |
                      local ANON_KEY = "${ANON_KEY}"
                      local SERVICE_ROLE_KEY = "${SERVICE_ROLE_KEY}"
                      local SUPABASE_PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}"
                      local SUPABASE_SECRET_KEY = "${SUPABASE_SECRET_KEY}"
                      local ANON_KEY_ASYMMETRIC = "${ANON_KEY_ASYMMETRIC}"
                      local SERVICE_ROLE_KEY_ASYMMETRIC = "${SERVICE_ROLE_KEY_ASYMMETRIC}"
                      local TRANSLATION_ENABLED = SUPABASE_SECRET_KEY ~= "" and SUPABASE_PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_KEY_ASYMMETRIC ~= "" and ANON_KEY_ASYMMETRIC ~= ""

                      local PROTECTED_ROUTES = {
                        ["auth-v1-protected"] = true,
                      }

                      local function is_protected_route(route_name)
                        if route_name == nil or route_name == "" then
                          return false
                        end

                        return PROTECTED_ROUTES[route_name] == true
                      end

                      local function is_valid_apikey(apikey)
                        if apikey == nil or apikey == "" then
                          return false
                        end

                        if SERVICE_ROLE_KEY ~= "" and apikey == SERVICE_ROLE_KEY then
                          return true
                        end

                        if ANON_KEY ~= "" and apikey == ANON_KEY then
                          return true
                        end

                        if TRANSLATION_ENABLED and apikey == SUPABASE_SECRET_KEY then
                          return true
                        end

                        if TRANSLATION_ENABLED and apikey == SUPABASE_PUBLISHABLE_KEY then
                          return true
                        end

                        return false
                      end

                      function envoy_on_request(request_handle)
                        local headers = request_handle:headers()
                        local route_name = request_handle:streamInfo():routeName()
                        if not is_protected_route(route_name) then
                          return
                        end

                        if is_valid_apikey(headers:get("apikey")) then
                          return
                        end

                        request_handle:respond({
                          [":status"] = "401",
                          ["content-type"] = "text/plain",
                        }, "Unauthorized")
                      end

                # Translate only header-based opaque API keys for provider services.
                - name: envoy.filters.http.lua
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    inline_code: |
                      local SECRET_KEY = "${SUPABASE_SECRET_KEY}"
                      local PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}"
                      local SERVICE_ROLE_JWT = "${SERVICE_ROLE_KEY_ASYMMETRIC}"
                      local ANON_JWT = "${ANON_KEY_ASYMMETRIC}"

                      function envoy_on_request(request_handle)
                        local headers = request_handle:headers()
                        local apikey = headers:get("apikey")
                        if apikey == SECRET_KEY then
                          headers:replace("apikey", SERVICE_ROLE_JWT)
                        elseif apikey == PUBLISHABLE_KEY then
                          headers:replace("apikey", ANON_JWT)
                        end
                      end

                # Supply the translated API-key JWT when no user JWT was sent.
                - name: envoy.filters.http.lua
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    inline_code: |
                      local function has_real_jwt(value)
                        return value ~= nil and string.sub(value, 1, 7) == "Bearer " and string.sub(value, 1, 10) ~= "Bearer sb_"
                      end

                      function envoy_on_request(request_handle)
                        local headers = request_handle:headers()
                        if has_real_jwt(headers:get("authorization")) then
                          return
                        end
                        local apikey = headers:get("apikey")
                        if apikey ~= nil and apikey ~= "" then
                          headers:replace("authorization", "Bearer " .. apikey)
                        end
                      end

                - name: envoy.filters.http.rbac
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                    rules:
                      action: ALLOW
                      policies:
                        apikey:
                          permissions:
                            - url_path:
                                path:
                                  prefix: /auth/v1/
                          principals:
                            - header:
                                name: apikey
                                string_match:
                                  exact: '${SERVICE_ROLE_KEY}'
                            - header:
                                name: apikey
                                string_match:
                                  exact: '${ANON_KEY}'
                            - header:
                                name: apikey
                                string_match:
                                  exact: '${SERVICE_ROLE_KEY_ASYMMETRIC}'
                            - header:
                                name: apikey
                                string_match:
                                  exact: '${ANON_KEY_ASYMMETRIC}'
                - name: envoy.filters.http.router
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
