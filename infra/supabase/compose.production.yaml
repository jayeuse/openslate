# One client installation. Render Caddyfile and provision the application roles,
# schema, and private app environment before up.
# The base Compose file owns provider services; this overlay adds OpenSlate.
services:
  api-gw:
    # Realtime ingress does not grant gateway peers trusted API proxy status.
    # The separate publisher listener on 8001 remains unpublished in production.
    networks:
      - realtime-ingress

  db:
    # A production application uses db:5432 on the provider network. Keep the
    # database out of host networking even if a future base file adds a port.
    ports: !reset []

  api:
    image: ${OPENSLATE_SERVER_IMAGE:?Set a versioned OpenSlate server image name}
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      api-gw:
        condition: service_healthy
    env_file:
      - path: ${OPENSLATE_APP_ENV_FILE:?Set an owner-only application env file}
        required: true
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: postgres
      BACKEND_BIND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      # API worker processes (C8, measured 2026-10-29): 2 and 3 workers raised request
      # latency against 1 under the two-pack load. A Compose project variable: set it in
      # the provider installation environment; this entry overrides the app env file.
      # Raise it only with a new measurement and keep API_WORKERS x (pool + overflow + 3)
      # below PostgreSQL max_connections.
      API_WORKERS: ${API_WORKERS:-1}
      OPENSLATE_APP_PRIVATE_SUBNET: &app-private-subnet ${OPENSLATE_APP_PRIVATE_SUBNET:-172.31.248.0/28}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_AUTH_ISSUER: ${API_EXTERNAL_URL:?Set the installation Auth issuer}
      SMTP_HOST: ${SMTP_HOST:?Set an SMTP host}
      SMTP_PORT: ${SMTP_PORT:?Set an SMTP port}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:?Set the invitation sender email}
      LOG_DIR: /var/log/openslate/api
      BACKUP_EXPORT_ROOT: /var/lib/openslate/backup-exports
    volumes:
      - type: bind
        source: ${OPENSLATE_LOG_ROOT:?Set a private writable log directory}
        target: /var/log/openslate
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENSLATE_BACKUP_EXPORT_ROOT:?Set the owned finished backup-export directory}
        target: /var/lib/openslate/backup-exports
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - provider
      - app-private

  caddy:
    image: ${OPENSLATE_CADDY_IMAGE:?Set a versioned OpenSlate Caddy image name}
    build:
      context: ../..
      dockerfile: infra/docker/caddy.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CADDY_PUBLIC_BIND_HOST:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
    environment:
      OPENSLATE_REALTIME_UPSTREAM: api-gw:8000
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Generate the publishable gateway key}
    volumes:
      - type: bind
        source: ${CADDY_CONFIG_PATH:?Render an OpenSlate production Caddyfile first}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CADDY_TLS_DIR:-../../infra/caddy/reference}
        target: /run/caddy-tls
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=700
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Let the non-root Caddy process bind container port 443 without NET_BIND_SERVICE.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3449/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app-private
      - public-ingress
      - realtime-ingress

volumes:
  caddy-data:

networks:
  realtime-ingress:
    internal: true
  app-private:
    internal: true
    ipam:
      config:
        - subnet: *app-private-subnet
  public-ingress:
