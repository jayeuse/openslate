# Private worker network only. No published port, local path scans or hooks.
Foreground yes
# The serving entrypoint appends the required FILES_CLAMAV_PORT.
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
OfficialDatabaseOnly yes
SelfCheck 0
ConcurrentDatabaseReload no
MaxThreads 1
MaxQueue 2
MaxConnectionQueueLength 2
ReadTimeout 30
CommandReadTimeout 5
SendBufTimeout 500
StreamMaxLength 25M
MaxScanSize 100M
MaxFileSize 25M
MaxFiles 2048
MaxRecursion 10
# In 1.4.6 this time bound applies to ZIP scans, not all parsers.
MaxScanTime 45000
ScanPDF yes
ScanXMLDOCS yes
ScanArchive yes
ScanImage yes
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenMedia yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeUnsigned no
ExitOnOOM yes
LogClean no
LogVerbose no
LogSyslog no
ExtendedDetectionInfo no
Debug no
LeaveTemporaryFiles no
