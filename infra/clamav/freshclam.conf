# One-shot operator maintenance only; never run beside the serving engine.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
TestDatabases yes
Bytecode yes
ConnectTimeout 30
ReceiveTimeout 60
MaxAttempts 2
Foreground yes
# Deliberately no NotifyClamd, custom mirrors, hooks, or updater daemon.
