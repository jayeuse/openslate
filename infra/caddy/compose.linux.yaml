# Native Linux containers cannot reach host-loopback services through the bridge.
# The opt-in gateway therefore shares the host network and binds only the
# address rendered from GATEWAY_BIND_HOST. Docker Desktop uses compose.yaml.
services:
  caddy:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    networks: !reset []
    environment:
      OPENSLATE_REALTIME_UPSTREAM: 127.0.0.1:${SUPABASE_API_PORT:-58000}
