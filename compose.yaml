# Optional Caddy gateway; Supabase services live in infra/supabase/compose.yaml.
services:
  caddy:
    build:
      context: .
      dockerfile: infra/docker/caddy.Dockerfile
    profiles: ["gateway"]
    init: true
    restart: unless-stopped
    user: "1000:1000"
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-3448}:3448"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${CADDY_CONFIG_PATH:-./.agent-runtime/caddy/Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3449/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - gateway-host

volumes:
  caddy-data:

networks:
  gateway-host:
