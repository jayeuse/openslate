name: Frontend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_LAYER: all
  BASE_URL: http://127.0.0.1:3104
  PLAYWRIGHT_CONFIGURATION: process

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        name: Classify changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run_frontend == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        if: steps.scope.outputs.run_frontend == 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install pinned Playwright Chromium
        if: steps.scope.outputs.run_frontend == 'true'
        working-directory: frontend
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Check formatting, lint, and types
        if: steps.scope.outputs.run_frontend == 'true'
        working-directory: frontend
        run: npm run check

      - name: Run retained frontend tests
        if: steps.scope.outputs.run_frontend == 'true'
        working-directory: frontend
        run: npm test

      - name: Build the production frontend
        if: steps.scope.outputs.run_frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: No frontend checks required
        if: >-
          steps.scope.outputs.run_frontend != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason_frontend }}
        run: |
          printf 'Frontend check satisfied without execution: %s\n' "$REASON"
