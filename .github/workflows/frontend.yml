name: Frontend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_LAYER: all
  BASE_URL: http://127.0.0.1:3104
  PLAYWRIGHT_CONFIGURATION: process

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
      reason_frontend: ${{ steps.scope.outputs.reason_frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check formatting, lint, and types
        run: npm run check

  build:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build the production frontend
        run: npm run build
      - name: Keep the static export for the browser tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-export
          path: frontend/out/
          if-no-files-found: error
          retention-days: 1

  isolated:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      # The development-ingress test drives next dev in Chromium.
      - name: Restore the pinned Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install pinned Playwright Chromium
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run isolated frontend tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/isolated.json
        run: npm test -- --project=isolated --reporter=line,json
      - name: Record the checked-out test identity
        if: ${{ always() }}
        run: |
          mkdir -p test-results/ci
          printf 'revision=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\njob=%s\nproject=isolated\nshard=none\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" \
            > test-results/ci/isolated.metadata.txt
          test -s test-results/ci/isolated.json
      - name: Keep the native Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-playwright-isolated
          path: |
            frontend/test-results/ci/isolated.json
            frontend/test-results/ci/isolated.metadata.txt
          retention-days: 14
          if-no-files-found: error

  test:
    name: test (${{ matrix.suite }})
    needs: [changes, build]
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    # The browser install pulls apt packages and can be slow on a busy mirror;
    # the test step keeps its own 15-minute hang limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The http project runs against the static export through the production
        # static-site code (frontend/playwright.config.ts). Whole-file shards use
        # verified CI duration weights; current native collection owns membership.
        include:
          - suite: http 1/6
            duration-shard: 1
          - suite: http 2/6
            duration-shard: 2
          - suite: http 3/6
            duration-shard: 3
          - suite: http 4/6
            duration-shard: 4
          - suite: http 5/6
            duration-shard: 5
          - suite: http 6/6
            duration-shard: 6
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install the locked backend that serves the static export
        working-directory: backend
        run: uv sync --locked
      - name: Restore the static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-export
          path: frontend/out/
      - name: Restore the pinned Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install pinned Playwright Chromium
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Plan whole-file duration shards from current native collection
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/collection.json
        run: |
          mkdir -p test-results/ci
          npm test -- --project=http --list --reporter=json
          python3 ../scripts/playwright_shards.py plan \
            --collection test-results/ci/collection.json --weights tests/http/.test-durations.json \
            --shard ${{ matrix.duration-shard }} --shards 6 \
            --test-list test-results/ci/selected.txt --receipt test-results/ci/assignment.json
      - name: Run browser tests against the static export
        timeout-minutes: 15
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/http-${{ strategy.job-index }}.json
        run: npm test -- --project=http --workers=2 --test-list=test-results/ci/selected.txt --reporter=line,json
      - name: Keep failure context and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results-${{ strategy.job-index }}
          path: frontend/test-results/playwright/
          retention-days: 7
          if-no-files-found: ignore
      - name: Record the checked-out test identity
        if: ${{ always() }}
        env:
          REPORT_SHARD: ${{ matrix.suite }}
          REPORT_DURATION_SHARD: ${{ matrix.duration-shard }}
        run: |
          mkdir -p test-results/ci
          printf 'revision=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\njob=%s\nproject=http\nshard=%s\nduration-shard=%s/6\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$REPORT_SHARD" "$REPORT_DURATION_SHARD" \
            > test-results/ci/http-${{ strategy.job-index }}.metadata.txt
          test -s test-results/ci/http-${{ strategy.job-index }}.json
      - name: Keep the native Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-playwright-http-${{ strategy.job-index }}
          path: |
            frontend/test-results/ci/http-${{ strategy.job-index }}.json
            frontend/test-results/ci/http-${{ strategy.job-index }}.metadata.txt
            frontend/test-results/ci/selected.txt
            frontend/test-results/ci/assignment.json
          retention-days: 14
          if-no-files-found: error

  verify:
    name: frontend-verify
    needs: [changes, check, build, isolated, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the Frontend required check
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
          ISOLATED: ${{ needs.isolated.result }}
          TEST: ${{ needs.test.result }}
          REASON: ${{ needs.changes.outputs.reason_frontend }}
        run: |
          test "$CHANGES" = "success"
          if [ "$RUN_FRONTEND" = "true" ]; then
            test "$CHECK" = "success"
            test "$BUILD" = "success"
            test "$ISOLATED" = "success"
            test "$TEST" = "success"
          else
            test "$CHECK" = "skipped"
            test "$BUILD" = "skipped"
            test "$ISOLATED" = "skipped"
            test "$TEST" = "skipped"
            printf 'Frontend check satisfied without execution: %s\n' "$REASON"
          fi
