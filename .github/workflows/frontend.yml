name: Frontend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_LAYER: all
  BASE_URL: http://127.0.0.1:3104
  PLAYWRIGHT_CONFIGURATION: process

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
      reason_frontend: ${{ steps.scope.outputs.reason_frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check formatting, lint, and types
        run: npm run check

  build:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build the production frontend
        run: npm run build
      - name: Keep the static export for the browser tests
        uses: actions/upload-artifact@v7
        with:
          name: frontend-export
          path: frontend/out/
          if-no-files-found: error
          retention-days: 1

  isolated:
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      # The development-ingress test drives next dev in Chromium.
      - name: Restore the pinned Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install pinned Playwright Chromium
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run isolated frontend tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/isolated.json
        run: npm test -- --project=isolated --reporter=line,json
      - name: Record the checked-out test identity
        if: ${{ always() }}
        run: |
          mkdir -p test-results/ci
          printf 'revision=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\njob=%s\nproject=isolated\nshard=none\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" \
            > test-results/ci/isolated.metadata.txt
          test -s test-results/ci/isolated.json
      - name: Keep the native Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-isolated
          path: |
            frontend/test-results/ci/isolated.json
            frontend/test-results/ci/isolated.metadata.txt
          retention-days: 14
          if-no-files-found: error

  test:
    name: test (${{ matrix.suite }})
    needs: [changes, build]
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    # The browser install pulls apt packages and can be slow on a busy mirror;
    # the test step keeps its own 15-minute hang limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The http project runs against the static export through the production
        # static-site code (frontend/playwright.config.ts). Shards and workers per
        # shard come from measurements (docs/plans/test-suite-tier-2-5.md, item 2).
        include:
          - suite: http 1/6
            args: --project=http --shard=1/6 --workers=2
          - suite: http 2/6
            args: --project=http --shard=2/6 --workers=2
          - suite: http 3/6
            args: --project=http --shard=3/6 --workers=2
          - suite: http 4/6
            args: --project=http --shard=4/6 --workers=2
          - suite: http 5/6
            args: --project=http --shard=5/6 --workers=2
          - suite: http 6/6
            args: --project=http --shard=6/6 --workers=2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install the locked backend that serves the static export
        working-directory: backend
        run: uv sync --locked
      - name: Restore the static export
        uses: actions/download-artifact@v7
        with:
          name: frontend-export
          path: frontend/out/
      - name: Restore the pinned Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install pinned Playwright Chromium
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run browser tests against the static export
        timeout-minutes: 15
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/http-${{ strategy.job-index }}.json
        run: npm test -- ${{ matrix.args }} --reporter=line,json
      - name: Keep failure context and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results-${{ strategy.job-index }}
          path: frontend/test-results/playwright/
          retention-days: 7
          if-no-files-found: ignore
      - name: Record the checked-out test identity
        if: ${{ always() }}
        env:
          REPORT_SHARD: ${{ matrix.suite }}
        run: |
          mkdir -p test-results/ci
          printf 'revision=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\njob=%s\nproject=http\nshard=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$REPORT_SHARD" \
            > test-results/ci/http-${{ strategy.job-index }}.metadata.txt
          test -s test-results/ci/http-${{ strategy.job-index }}.json
      - name: Keep the native Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-http-${{ strategy.job-index }}
          path: |
            frontend/test-results/ci/http-${{ strategy.job-index }}.json
            frontend/test-results/ci/http-${{ strategy.job-index }}.metadata.txt
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: [changes, check, build, isolated, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the Frontend required check
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
          ISOLATED: ${{ needs.isolated.result }}
          TEST: ${{ needs.test.result }}
          REASON: ${{ needs.changes.outputs.reason_frontend }}
        run: |
          test "$CHANGES" = "success"
          if [ "$RUN_FRONTEND" = "true" ]; then
            test "$CHECK" = "success"
            test "$BUILD" = "success"
            test "$ISOLATED" = "success"
            test "$TEST" = "success"
          else
            test "$CHECK" = "skipped"
            test "$BUILD" = "skipped"
            test "$ISOLATED" = "skipped"
            test "$TEST" = "skipped"
            printf 'Frontend check satisfied without execution: %s\n' "$REASON"
          fi
