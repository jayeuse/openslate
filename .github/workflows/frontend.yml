name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "infra/docker/frontend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/docker/frontend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate disposable image-test key
        run: |
          test_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          printf '::add-mask::%s\n' "$test_key"
          printf 'IMAGE_TEST_PUBLISHABLE_KEY=%s\n' "$test_key" >> "$GITHUB_ENV"
          unset test_key

      - name: Build frontend Docker image
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.IMAGE_TEST_PUBLISHABLE_KEY }}
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          --file infra/docker/frontend.Dockerfile
          --tag openslate-frontend:ci
          .

      - name: Assert frontend image environment boundary
        working-directory: ${{ github.workspace }}
        run: >-
          docker run --rm --env IMAGE_TEST_PUBLISHABLE_KEY --entrypoint /bin/sh openslate-frontend:ci -c
          'test "$NEXT_PUBLIC_SUPABASE_URL" = "https://example.invalid" &&
          test "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" = "$IMAGE_TEST_PUBLISHABLE_KEY" &&
          test -z "${BACKEND_URL+x}"'

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_PRODUCTION: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
