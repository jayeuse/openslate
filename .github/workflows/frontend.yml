name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "infra/docker/frontend.Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "scripts/environment.py"
      - "supabase/config.toml"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/docker/frontend.Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "scripts/environment.py"
      - "supabase/config.toml"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Configure strict test environment
        run: |
          test_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          printf '::add-mask::%s\n' "$test_key"
          {
            printf 'OPENSLATE_ENV_SOURCE=process\n'
            printf 'TEST_LAYER=all\nBASE_URL=http://127.0.0.1:3000\n'
            printf 'BACKEND_URL=http://backend.invalid\nSUPABASE_SERVER_URL=http://supabase.invalid\n'
            printf 'LOG_DIR=/tmp/openslate-frontend-logs\n'
            printf 'BFF_REQUEST_BODY_LIMIT_BYTES=1048576\nBFF_RESPONSE_BODY_LIMIT_BYTES=8388608\nBFF_REQUEST_DEADLINE_MS=60000\n'
            printf 'PORT=3000\nHOSTNAME=127.0.0.1\n'
            printf 'NEXT_PUBLIC_SUPABASE_URL=http://supabase.invalid\n'
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$test_key"
            printf 'NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED=false\n'
          } >> "$GITHUB_ENV"
          unset test_key

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build -- --from-process --webpack

      - name: Build frontend Docker image
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED: ${{ env.NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED }}
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          --build-arg NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED="$NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED"
          --file infra/docker/frontend.Dockerfile
          --tag openslate-frontend:ci
          .

      - name: Assert frontend image environment boundary
        working-directory: ${{ github.workspace }}
        run: >-
          docker run --rm --entrypoint /bin/sh openslate-frontend:ci -c
          'test -z "${BACKEND_URL+x}" && test -z "${SUPABASE_SERVER_URL+x}" &&
          test -z "${DATABASE_URL+x}" && test -z "${MIGRATION_DATABASE_URL+x}" &&
          test -z "${SUPABASE_SECRET_KEY+x}" && test -z "${SECURITY_EVENT_SERVER_KEY+x}" &&
          test -z "${LOG_DIR+x}" &&
          test -z "${NEXT_PUBLIC_SUPABASE_URL+x}" &&
          test -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY+x}" &&
          test -z "${NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED+x}"'

      - name: Run end-to-end tests
        run: PLAYWRIGHT_USE_PRODUCTION=1 PLAYWRIGHT_CONFIGURATION=process node scripts/run-playwright.mjs --max-failures=5

      - name: Verify scanner UI executable coverage
        run: npm run test:scanner:coverage

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
