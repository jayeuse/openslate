name: Frontend Compatibility

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: frontend-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSLATE_ENV_SOURCE: process
  TEST_LAYER: browser
  BASE_URL: http://127.0.0.1:3104
  PLAYWRIGHT_CONFIGURATION: process
  BACKEND_URL: http://backend.invalid
  SUPABASE_SERVER_URL: http://supabase.invalid
  LOG_DIR: /tmp/openslate-frontend-logs
  BFF_REQUEST_BODY_LIMIT_BYTES: "1048576"
  BFF_RESPONSE_BODY_LIMIT_BYTES: "8388608"
  BFF_REQUEST_DEADLINE_MS: "60000"
  PORT: "3104"
  HOSTNAME: 127.0.0.1
  NEXT_PUBLIC_SUPABASE_URL: http://supabase.invalid
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
  NEXT_PUBLIC_LIFECYCLE_PURGE_ENABLED: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build -- --from-process
      - run: node scripts/package-runtime.cjs --mode=native --source=. --output=test-results/frontend-runtime.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-compatibility-runtime
          path: frontend/test-results/frontend-runtime.tgz
          if-no-files-found: error
          retention-days: 1

  main-browser:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - uses: actions/download-artifact@v7
        with:
          name: frontend-compatibility-runtime
          path: frontend/test-results
      - run: tar -xzf test-results/frontend-runtime.tgz
      - run: npm run test:e2e:compatibility -- --project=${{ matrix.project }} --retries=0 --max-failures=5
      - name: Record a sanitized failed project
        if: failure()
        run: |
          node -e 'require("node:fs").writeFileSync("failure-${{ matrix.project }}.json", JSON.stringify({project:"${{ matrix.project }}",run:process.env.GITHUB_RUN_ID}))'
          if [ -d test-results/playwright ]; then
            tar -czf failure-evidence-${{ matrix.project }}.tgz test-results/playwright failure-${{ matrix.project }}.json
            test "$(du -k failure-evidence-${{ matrix.project }}.tgz | cut -f1)" -le 25600
          else
            tar -czf failure-evidence-${{ matrix.project }}.tgz failure-${{ matrix.project }}.json
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-failure-${{ matrix.project }}
          path: frontend/failure-evidence-${{ matrix.project }}.tgz
          if-no-files-found: error
          retention-days: 7

  nightly-browser:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install the assigned browser
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chromium' && 'chromium' || matrix.project }}
      - uses: actions/download-artifact@v7
        with:
          name: frontend-compatibility-runtime
          path: frontend/test-results
      - run: tar -xzf test-results/frontend-runtime.tgz
      - run: npm run test:e2e:compatibility -- --project=${{ matrix.project }} --retries=0 --max-failures=5
      - name: Record a sanitized failed project
        if: failure()
        run: |
          node -e 'require("node:fs").writeFileSync("failure-${{ matrix.project }}.json", JSON.stringify({project:"${{ matrix.project }}",run:process.env.GITHUB_RUN_ID}))'
          if [ -d test-results/playwright ]; then
            tar -czf failure-evidence-${{ matrix.project }}.tgz test-results/playwright failure-${{ matrix.project }}.json
            test "$(du -k failure-evidence-${{ matrix.project }}.tgz | cut -f1)" -le 25600
          else
            tar -czf failure-evidence-${{ matrix.project }}.tgz failure-${{ matrix.project }}.json
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-failure-${{ matrix.project }}
          path: frontend/failure-evidence-${{ matrix.project }}.tgz
          if-no-files-found: error
          retention-days: 7

  notify:
    needs: [build, main-browser, nightly-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update, or resolve the compatibility issue
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MAIN_RESULT: ${{ needs.main-browser.result }}
          NIGHTLY_RESULT: ${{ needs.nightly-browser.result }}
        with:
          script: |
            const title = "[CI] Frontend compatibility is failing";
            const results = [process.env.BUILD_RESULT, process.env.MAIN_RESULT, process.env.NIGHTLY_RESULT];
            const failed = results.some((result) => result === "failure" || result === "cancelled");
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed) {
              for (const label of [
                {name: "ci", color: "d73a4a", description: "Continuous integration failure"},
                {name: "compatibility", color: "5319e7", description: "Browser compatibility"},
              ]) {
                try {
                  await github.rest.issues.getLabel({owner, repo, name: label.name});
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({owner, repo, ...label});
                }
              }
              const body = [
                "Frontend compatibility requires investigation within the same business day.",
                "",
                `Run: ${runUrl}`,
                `Commit: ${context.sha}`,
                `Results: ${results.join(", ")}`,
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
                await github.rest.issues.addLabels({owner, repo, issue_number: existing.number, labels: ["ci", "compatibility"]});
              } else {
                await github.rest.issues.create({owner, repo, title, body, labels: ["ci", "compatibility"]});
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Compatibility recovered: ${runUrl}`,
              });
              await github.rest.issues.update({owner, repo, issue_number: existing.number, state: "closed"});
            }
