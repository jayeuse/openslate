name: Labeler

# pull_request_target gives a write token also for Dependabot PRs. It is safe here
# because no step checks out or runs code from the pull request: the labeler only
# reads the changed-file list and the config from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number(s) to label, one per line (backfill or test)"
        required: true

permissions: {}

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          pr-number: ${{ inputs.pr-number }}
