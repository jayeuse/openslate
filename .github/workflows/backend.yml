name: Backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.scope.outputs.base }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_backend_container: ${{ steps.scope.outputs.run_backend_container }}
      reason_backend: ${{ steps.scope.outputs.reason_backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Run Ruff
        run: uv run ruff check . ../scripts ../tests/tooling ../packaging/backup
      - name: Run mypy
        run: uv run mypy app operations ../scripts/ci_scope.py ../scripts/prepush.py ../scripts/run_tests.py ../packaging/backup/backup_installation.py
      - name: Run packaging backup contracts
        run: >-
          uv run pytest ../packaging/backup/tests/test_backup_installation.py
          --no-cov --basetemp test-results/backup-contracts
      - name: Verify test selection and tooling
        run: uv run python -m unittest discover -s ../tests/tooling -t .. -p 'test_*.py'

  coverage:
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Complete disposable PostgreSQL tests and coverage gates
        env:
          COVERAGE_BASE_REF: ${{ needs.changes.outputs.base }}
        run: uv run python -m tests.fullstack_runner --backend-coverage-only
      - name: Upload compact backend coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/test-results/coverage/coverage.json
            backend/test-results/coverage/coverage.xml
            backend/test-results/coverage/metadata.json
            backend/test-results/coverage/gate.json
            backend/test-results/coverage/operational-coverage.json
            backend/test-results/coverage/summary.json
          if-no-files-found: ignore
          retention-days: 14

  container:
    needs: changes
    if: needs.changes.outputs.run_backend_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: openslate-backend:ci
          cache-from: type=gha,scope=openslate-backend
          cache-to: type=gha,mode=max,scope=openslate-backend

  verify:
    needs: [changes, quality, coverage, container]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the Backend required check
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_CONTAINER: ${{ needs.changes.outputs.run_backend_container }}
          QUALITY: ${{ needs.quality.result }}
          COVERAGE: ${{ needs.coverage.result }}
          CONTAINER: ${{ needs.container.result }}
          REASON: ${{ needs.changes.outputs.reason_backend }}
        run: |
          test "$CHANGES" = "success"
          if [ "$RUN_BACKEND" = "true" ]; then
            test "$QUALITY" = "success"
            test "$COVERAGE" = "success"
          else
            test "$QUALITY" = "skipped"
            test "$COVERAGE" = "skipped"
            printf 'Backend checks skipped: %s\n' "$REASON"
          fi
          if [ "$RUN_CONTAINER" = "true" ]; then
            test "$CONTAINER" = "success"
          else
            test "$CONTAINER" = "skipped"
          fi
