name: Backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.scope.outputs.base }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_server_image: ${{ steps.scope.outputs.run_server_image }}
      reason_backend: ${{ steps.scope.outputs.reason_backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base "$BASE_SHA" HEAD)"
          fi
          python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Refuse weakened tests (plan item 14)
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
        run: python3 scripts/assertion_guard.py --base "$BASE_SHA"

  quality:
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Run Ruff
        run: uv run ruff check . ../scripts ../tests/tooling ../packaging/backup
      - name: Run mypy
        run: >-
          uv run mypy app operations
          ../scripts/ci_scope.py ../scripts/prepush.py ../scripts/environment.py
          ../scripts/dev.py ../scripts/run_tests.py ../scripts/assertion_guard.py
          ../packaging/backup/backup_installation.py
          ../packaging/backup/restore_installation.py
      - name: Run packaging backup contracts
        run: >-
          uv run pytest ../packaging/backup/tests
          --no-cov --basetemp .backup-contracts
      - name: Verify test selection and tooling
        run: uv run python -m unittest discover -s ../tests/tooling -t .. -p 'test_*.py'

  unit:
    # Tests not marked `integration` need no stack; they run here in parallel and the
    # stack shards below run only the integration tests.
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Run the unit lane without a stack
        env:
          COVERAGE_BASE_REF: ${{ needs.changes.outputs.base }}
        run: uv run python tests/backend_coverage.py unit --workers 4
      - name: Upload unit lane coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-unit
          path: |
            backend/test-results/coverage/coverage.data
            backend/test-results/coverage/pytest.xml
            backend/test-results/coverage/metadata.json
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: coverage (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Provision pinned native Caddy
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          caddy_image="$(timeout 10 uv run --no-sync python -c 'from tests.caddy_runtime import CADDY_IMAGE; print(CADDY_IMAGE)')"
          [[ "$caddy_image" =~ ^caddy@sha256:[0-9a-f]{64}$ ]]
          caddy_dir="$(mktemp -d "${RUNNER_TEMP:?}/openslate-caddy.XXXXXX")"
          caddy_container="openslate-ci-${caddy_dir##*/}"
          cleanup() {
            result=$?
            trap - EXIT
            timeout 30 docker rm --force "$caddy_container" >/dev/null || result=1
            exit "$result"
          }
          trap cleanup EXIT
          timeout 120 docker pull "$caddy_image"
          timeout 30 docker create --name "$caddy_container" "$caddy_image" >/dev/null
          timeout 30 docker cp "$caddy_container:/usr/bin/caddy" "$caddy_dir/caddy"
          chmod 0755 "$caddy_dir/caddy"
          timeout 10 "$caddy_dir/caddy" version
          printf '%s\n' "$caddy_dir" >> "${GITHUB_PATH:?}"
      - name: Run one disposable Supabase test shard
        env:
          COVERAGE_BASE_REF: ${{ needs.changes.outputs.base }}
        run: uv run python -m tests.fullstack_runner --backend-coverage-shard ${{ matrix.shard }}/5
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: |
            backend/test-results/coverage/coverage.data
            backend/test-results/coverage/pytest.xml
            backend/test-results/coverage/metadata.json
            backend/test-results/coverage/summary.json
            backend/test-results/coverage/test-durations.json
            backend/test-results/coverage/operational-coverage.json
          if-no-files-found: ignore
          retention-days: 14

  coverage-gate:
    needs: [changes, unit, coverage]
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The stack shards and the unit lane.
          pattern: backend-coverage-*
          path: ${{ runner.temp }}/coverage-shards
      - name: Combine shards and apply the coverage gates
        env:
          COVERAGE_BASE_REF: ${{ needs.changes.outputs.base }}
        run: >-
          uv run python tests/backend_coverage.py combine
          "$RUNNER_TEMP/coverage-shards" --shards 5
      - name: Upload compact backend coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/test-results/coverage/coverage.json
            backend/test-results/coverage/coverage.xml
            backend/test-results/coverage/metadata.json
            backend/test-results/coverage/gate.json
            backend/test-results/coverage/operational-coverage.json
            backend/test-results/coverage/test-durations.json
          if-no-files-found: ignore
          retention-days: 14

  reset-acceptance:
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Verify committed provider reset on a separate disposable stack
        run: uv run python -m tests.fullstack_runner --reset-acceptance-only
      - name: Upload reset batch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reset-acceptance
          path: backend/test-results/batches/*.json
          if-no-files-found: ignore
          retention-days: 14

  container:
    needs: changes
    if: needs.changes.outputs.run_server_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build unified FastAPI server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: openslate-server:ci
          cache-from: type=gha,scope=openslate-server
          cache-to: type=gha,mode=max,scope=openslate-server

  verify:
    name: backend-verify
    needs:
      - changes
      - quality
      - unit
      - coverage
      - coverage-gate
      - reset-acceptance
      - container
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the Backend required check
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_SERVER_IMAGE: ${{ needs.changes.outputs.run_server_image }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          COVERAGE: ${{ needs.coverage.result }}
          COVERAGE_GATE: ${{ needs.coverage-gate.result }}
          RESET: ${{ needs.reset-acceptance.result }}
          CONTAINER: ${{ needs.container.result }}
          REASON: ${{ needs.changes.outputs.reason_backend }}
        run: |
          test "$CHANGES" = "success"
          if [ "$RUN_BACKEND" = "true" ]; then
            test "$QUALITY" = "success"
            test "$UNIT" = "success"
            test "$COVERAGE" = "success"
            test "$COVERAGE_GATE" = "success"
            test "$RESET" = "success"
          else
            test "$QUALITY" = "skipped"
            test "$UNIT" = "skipped"
            test "$COVERAGE" = "skipped"
            test "$COVERAGE_GATE" = "skipped"
            test "$RESET" = "skipped"
            printf 'Backend checks skipped: %s\n' "$REASON"
          fi
          if [ "$RUN_SERVER_IMAGE" = "true" ]; then
            test "$CONTAINER" = "success"
          else
            test "$CONTAINER" = "skipped"
          fi
