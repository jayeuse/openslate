name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/test*.py"
      - "scripts/check_coverage.py"
      - "infra/docker/backend.Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "scripts/environment.py"
      - "supabase/**"
      - ".env.example"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/test*.py"
      - "scripts/check_coverage.py"
      - "infra/docker/backend.Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "scripts/environment.py"
      - "supabase/**"
      - ".env.example"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Install backend dependencies
        run: uv sync --locked
      - name: Record coverage comparison base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=$(git merge-base HEAD "$BASE_REF")
          printf 'COVERAGE_BASE_REF=%s\n' "$base" >> "$GITHUB_ENV"
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy app scripts
      - name: Verify test selection and tooling
        run: uv run python -m unittest discover -s ../scripts -p 'test_*.py'
      - name: Complete disposable PostgreSQL tests and 90 percent coverage gates
        run: uv run python -m tests.fullstack_runner --backend-coverage-only
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/test-results/coverage
          if-no-files-found: error
      - name: Build backend Docker image
        working-directory: ${{ github.workspace }}
        run: docker build --file infra/docker/backend.Dockerfile --tag openslate-backend:ci .
