name: Full-stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Full-stack release gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get("BASE_SHA", "")
          relevant = True
          if base and set(base) != {"0"}:
              result = subprocess.run(["git", "diff", "--name-only", base, "HEAD"], capture_output=True, text=True)
              if result.returncode == 0:
                  relevant = any(p.startswith(("backend/", "frontend/", "supabase/", "infra/", ".github/workflows/")) or p in {".env.example", ".dockerignore"} for p in result.stdout.splitlines())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={'true' if relevant else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.run == 'true'
        with:
          version: latest

      - name: Install locked dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci && npx playwright install --with-deps chromium)

      - name: Verify the disposable production stack
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: uv run python tests/fullstack_runner.py

      - name: No relevant application changes
        if: steps.changes.outputs.run != 'true'
        run: echo "Full-stack gate satisfied; no relevant application changes."

      - name: Preserve sanitized acceptance summary
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-summary
          path: frontend/test-results/fullstack-summary.json
          if-no-files-found: ignore
          retention-days: 7
