name: Full-stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage_base:
        description: Git revision used to classify the requested run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Full-stack release gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENSLATE_ENV_SOURCE: process
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.coverage_base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'run_fullstack=true\n' >> "$GITHUB_OUTPUT"
            printf 'reason_fullstack=Manual full-stack dispatch\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run_fullstack == 'true'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.1.0
        if: steps.changes.outputs.run_fullstack == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_fullstack == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v3
        if: steps.changes.outputs.run_fullstack == 'true'
        with:
          version: latest

      - name: Install locked dependencies
        if: steps.changes.outputs.run_fullstack == 'true'
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci && npx playwright install --with-deps chromium)

      - name: Verify the disposable production stack without duplicate regression
        if: steps.changes.outputs.run_fullstack == 'true'
        working-directory: backend
        run: uv run python -m tests.fullstack_runner --acceptance-only

      - name: No relevant application changes
        if: steps.changes.outputs.run_fullstack != 'true'
        env:
          REASON: ${{ steps.changes.outputs.reason_fullstack }}
        run: |
          printf 'Full-stack gate satisfied without provisioning: %s\n' "$REASON"

      - name: Preserve sanitized acceptance summary
        if: always() && steps.changes.outputs.run_fullstack == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fullstack-summary
          path: frontend/test-results/fullstack-summary.json
          if-no-files-found: ignore
          retention-days: 7
