name: Native Manager development artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: slateops-manager-macos-development
          - os: windows-2025
            artifact: slateops-manager-windows-development
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match the development machine (uv 0.12); bump both together.
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked packaging dependencies
        run: uv sync --locked --group manager
      - name: Run manager boundary tests
        run: >-
          uv run --group manager python -m unittest discover
          -s ../tests/tooling -t .. -p 'test_native_manager.py'
      - name: Lint the manager package
        run: >-
          uv run --group manager ruff check ../packaging/manager
          ../scripts/build_native_manager.py ../tests/tooling/test_native_manager.py
      - name: Type-check the manager package
        working-directory: packaging/manager
        run: >-
          uv run --project ../../backend --group manager mypy
          --explicit-package-bases slateops_manager main.py
      - name: Type-check the manager builder
        env:
          MYPYPATH: ../packaging/manager
        run: uv run --group manager mypy ../scripts/build_native_manager.py
      - name: Build unsigned host-native development artifact
        run: >-
          uv run --group manager python ../scripts/build_native_manager.py
          --origin https://manager-ci.invalid --version 0.0.0-ci
          --output-dir ../dist/native-manager
      - name: Archive the macOS app bundle
        if: matrix.os == 'macos-15'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "../dist/native-manager/Slate Operations Manager.app"
          "../dist/${{ matrix.artifact }}.zip"
      - name: Archive the Windows application folder
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: >-
          Compress-Archive -LiteralPath '..\dist\native-manager\Slate Operations Manager'
          -DestinationPath '..\dist\${{ matrix.artifact }}.zip' -Force
      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 7
