# Monthly grouped updates keep the number of full CI runs low.
# Groups take only minor and patch versions; a major version opens its own PR,
# so one breaking upgrade (for example TypeScript 7) cannot block the group.
# Risky upgrades are split out, never ignored: ignore rules also suppress security updates.
# Security updates still open as soon as an advisory is published.
# compose.yaml is not listed: its Supabase image pins change only with a tested stack upgrade.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv:
        applies-to: version-updates
        patterns: ["*"]
        # SQLAlchemy minor versions are breaking release series (2.1 removes the
        # mypy plugin), so SQLAlchemy opens its own PR.
        exclude-patterns: ["sqlalchemy"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
